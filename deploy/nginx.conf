# nginx für den statischen Export (out/), genutzt vom Dockerfile.
# Für einen Unterpfad (BASE_PATH=/roemer) den Export nach
# /usr/share/nginx/html/roemer legen, die Regeln greifen dann unverändert.

# Dateien mit Prüfsumme in der URL (?v=, assetUrl in src/config.js)
# ändern sich nie, ohne ?v= fragt der Browser jedes Mal nach
map $arg_v $asset_cache {
	"" "no-cache";
	default "public, max-age=31536000, immutable";
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain application/octet-stream application/wasm;
	# .gz-Fassungen aus scripts/precompress.mjs, stärker gepackt
	gzip_static on;

	# Gehashte Next-Chunks dürfen lange im Cache bleiben
	location ~ /_next/static/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# nginx kennt .mjs nicht, Modul-Worker brauchen aber einen JS-Typ
	location ~ /maplibre/ {
		types { application/javascript mjs; }
		default_type application/javascript;
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	# Daten mit Prüfsumme in der URL (?v=) dürfen unbegrenzt in den Cache
	location ~ /(precomputed|altkarten|models|csl)/ {
		add_header Cache-Control $asset_cache;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ $uri.html =404;
	}

	error_page 404 /404.html;
}
