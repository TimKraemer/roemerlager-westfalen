# nginx für den statischen Export (out/), genutzt vom Dockerfile.
# Für einen Unterpfad (BASE_PATH=/roemer) den Export nach
# /usr/share/nginx/html/roemer legen, die Regeln greifen dann unverändert.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain application/octet-stream;

	# Gehashte Next-Chunks dürfen lange im Cache bleiben
	location ~ /_next/static/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# nginx kennt .mjs nicht, Modul-Worker brauchen aber einen JS-Typ
	location ~ /maplibre/ {
		types { application/javascript mjs; }
		default_type application/javascript;
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ $uri.html =404;
	}

	error_page 404 /404.html;
}
