<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>erleben.app Experimente</title>
<style>
	:root { color-scheme: light dark; --bg: #f6f3ee; --fg: #222; --muted: #666; --accent: #8d2a1e; }
	@media (prefers-color-scheme: dark) { :root { --bg: #1c1a18; --fg: #eee; --muted: #aaa; --accent: #e08a7a; } }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
	main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
	h1 { font-size: 1.5rem; margin: 0 0 4px; }
	p { color: var(--muted); margin: 0 0 32px; }
	a { color: var(--accent); font-weight: 600; text-decoration: none; }
	li { margin-bottom: 16px; }
	li span { display: block; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
	<h1>Experimente</h1>
	<p>Prototypen aus dem Umfeld von erleben.app.</p>
	<ul>
		<li><a href="/roemer/">Römerlager in Westfalen</a>
			<span>Bekannte Römerlager und eine Potenzialkarte für noch unentdeckte Marschlager</span></li>
	</ul>
</main>
</body>
</html>
