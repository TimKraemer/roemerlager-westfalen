# nginx für experiments.erleben.app (Container "experiments").
# Server-Pfad: /opt/services/experiments-nginx.conf
# Jedes Experiment liegt als statischer Export in einem Unterordner von
# /var/www/www-experiments, z. B. roemer/ für die Römerlager-Karte.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	# Experimente, nicht für Suchmaschinen
	add_header X-Robots-Tag "noindex, nofollow" always;

	# Gehashte Next-Chunks dürfen lange im Cache bleiben
	location ~ ^/[^/]+/_next/static/ {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# nginx:alpine kennt .mjs nicht, Modul-Worker brauchen aber einen JS-Typ
	location ~ ^/[^/]+/maplibre/ {
		types { application/javascript mjs; }
		default_type application/javascript;
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	location / {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ $uri.html =404;
	}

	error_page 404 /404.html;
}
